<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calorie Counter{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased font-sans">
    
    {% if messages %}
    <div class="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4">
        {% for message in messages %}
        <div class="bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg font-medium text-sm flex items-center justify-between border border-emerald-500 animate-bounce">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()" class="text-emerald-200 hover:text-white ml-3 font-bold">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="py-10 px-4 sm:px-6 lg:px-8">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
